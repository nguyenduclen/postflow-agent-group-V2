name: Build PostFlow Agent FINAL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-disabled: true

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -not -path './.git/*' -print -quit | xargs -r dirname
          }

          PROJECT_DIR="$(find_project || true)"

          # If the repository contains the source as a ZIP, extract it automatically.
          # This supports the exact upload layout where the repo contains:
          # .github/workflows/build-apk.yml + PostFlow-Agent-*.zip
          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -print | head -n 1 || true)"
            if [ -n "$ZIP_FILE" ]; then
              echo "Android source ZIP detected: $ZIP_FILE"
              rm -rf .postflow-source
              mkdir -p .postflow-source
              unzip -q "$ZIP_FILE" -d .postflow-source
              PROJECT_DIR="$(find_project || true)"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Khong tim thay Android project."
            echo "Can settings.gradle/settings.gradle.kts + app/build.gradle(.kts)."
            echo "Cay repository:"
            find . -maxdepth 6 -type f -not -path './.git/*' | sort | head -400
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Tim thay settings.gradle nhung khong co app/build.gradle(.kts): $PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: Khong tim thay AndroidManifest.xml trong $PROJECT_DIR/app/src/main"
            exit 1
          fi

          # Fix known Java syntax issue in PostFlowAccessibilityService.java:
          # the method containing "if (!chromeWindowFound) return;" was missing
          # its closing brace before the legacy commented-out implementation.
          SERVICE_FILE="$PROJECT_DIR/app/src/main/java/vn/phutungmaykubota/postflowagent/PostFlowAccessibilityService.java"
          if [ -f "$SERVICE_FILE" ]; then
            python3 -c 'import sys; from pathlib import Path; p=Path(sys.argv[1]); s=p.read_text(encoding="utf-8"); n="""        if (!chromeWindowFound) return;\n        return;\n\n        /* old single-window implementation intentionally removed */\n"""; r="""        if (!chromeWindowFound) return;\n        return;\n    }\n\n        /* old single-window implementation intentionally removed */\n"""; p.write_text(s.replace(n,r,1),encoding="utf-8") if n in s else None' "$SERVICE_FILE"
          fi

          echo "ANDROID_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -200

      - name: Verify PostFlowAccessibilityService.java
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_FILE="$ANDROID_PROJECT/app/src/main/java/vn/phutungmaykubota/postflowagent/PostFlowAccessibilityService.java"
          if [ -f "$SERVICE_FILE" ]; then
            echo "Checking Java source: $SERVICE_FILE"
            grep -n -A4 -B2 "old single-window implementation intentionally removed" "$SERVICE_FILE" || true
          else
            echo "ERROR: PostFlowAccessibilityService.java not found"
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          find "$ANDROID_PROJECT/app/build/outputs/apk" -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PostFlow-Agent-FINAL
          path: "${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
